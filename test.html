<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入力フォーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="colorButton">背景色を変更</button><br><br>
    <input type="text" id="input">
    <button id="displayButton">表示</button>
    <button id="addButton">追加</button><br>
    <p id="output"></p>
    <p>現在の行数：<span id="rowCount">0件</span></p>
    <table border="1" id="table">
        <tr>
            <th>内容</th>
            <th>操作</th>
        </tr>
    </table>
    <script src="style.js"></script>
</body>
</html>
